# Overlay on deploy/compose.yaml. All relative paths are relative to deploy/.
# Use production/configure.py stack so both env files and both compose files are loaded.
services:
  engine:
    environment:
      LPB_AUTH: jwt
      LPB_JWT_ISSUER: https://${AUTH_HOST:?Run production/configure.py init}/realms/livepeer
      LPB_JWT_AUDIENCE: ${ENGINE_AUDIENCE:?Run production/configure.py init}
      LPB_JWT_SCOPE_CLAIM: scope
      LPB_JWT_ADMIN_SCOPE: livepeer:admin
      LPB_JWT_ADMIN_READ_SCOPE: livepeer:read
      LPB_JWT_NAME_CLAIM: preferred_username
      LPB_JWT_ALLOW_HTTP: "false"
      LPB_JWT_TOKEN_TYPES: at+jwt
    depends_on:
      keycloak:
        condition: service_healthy

  console:
    environment:
      CONSOLE_AUTH: oidc
      CONSOLE_PROTECT_READS: "true"
      CONSOLE_OIDC_ISSUER: https://${AUTH_HOST}/realms/livepeer
      CONSOLE_OIDC_CLIENT_ID: builder-console
      CONSOLE_OIDC_CLIENT_SECRET: ${BUILDER_CONSOLE_CLIENT_SECRET:?Run production/configure.py init}
      CONSOLE_OIDC_REDIRECT_URL: https://${CONSOLE_HOST:?Run production/configure.py init}/auth/callback
      CONSOLE_OIDC_ALLOW_HTTP: "false"
      CONSOLE_READER_CLIENT_ID: console-reader
      CONSOLE_READER_CLIENT_SECRET: ${CONSOLE_READER_CLIENT_SECRET:?Run production/configure.py init}
      CONSOLE_READER_SCOPE: livepeer:read
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?Run production/configure.py init}

  keycloak-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run production/configure.py init}
    volumes: [keycloak-db:/var/lib/postgresql/data]
    networks: [identity-db]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  keycloak:
    image: builder-console/keycloak:26.8.1-production
    build:
      context: ./keycloak/production
    command: [start, --optimized, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Run production/configure.py init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run production/configure.py init}
      BUILDER_CONSOLE_CLIENT_SECRET: ${BUILDER_CONSOLE_CLIENT_SECRET}
      CONSOLE_READER_CLIENT_SECRET: ${CONSOLE_READER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Run production/configure.py init}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Run production/configure.py init}
    volumes:
      - ./keycloak/production/runtime/livepeer-realm.json:/opt/keycloak/data/import/livepeer-realm.json:ro
    networks: [identity, identity-db]
    depends_on:
      keycloak-db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  edge:
    image: caddy:2.11.7-alpine
    environment:
      AUTH_HOST: ${AUTH_HOST}
      CONSOLE_HOST: ${CONSOLE_HOST}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./keycloak/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, identity]
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  identity:
  identity-db:
    internal: true

volumes:
  keycloak-db:
  caddy-data:
  caddy-config:
