# The builder-core stack and its read-only console. See deploy/README.md and docs/references/payment-stack.md.
# Batteries and the signer are built exactly as ChatLPT builds them (same pins, config and secrets layout).
# The engine is the stock `lpb serve` service built from a pinned builder-core commit. Nothing is published
# to the host except the console and the engine, and both only on 127.0.0.1.
name: builder-console

services:
  clearinghouse:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}builder-console/clearinghouse:ca09e47
    build:
      context: https://github.com/NE-Build-Track/clearinghouse-batteries.git#ca09e47c067682fb48c3f15425546fb6aa5b6659
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12
    restart: unless-stopped

  signer:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}builder-console/node:406b248
    build:
      context: https://github.com/NE-Build-Track/node.git#406b248f6cb8728e6e7eba1809901f589060bc6b
      dockerfile: docker/Dockerfile
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/pinned  # system CAs + certificates pinned by config/pin-orchestrator-certs.py
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./config/pinned-certs:/etc/ssl/pinned:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy
    restart: unless-stopped

  # The signer only binds its metrics listener (/healthz, /readyz, /metrics) on loopback. This relay shares
  # the clearinghouse namespace and re-exposes that listener on the internal compose network as
  # clearinghouse:8939, so the console can read it. It is never published to the host.
  signer-metrics:
    image: alpine/socat:1.8.0.3
    network_mode: service:clearinghouse
    command: ["TCP-LISTEN:8939,fork,reuseaddr", "TCP:127.0.0.1:8938"]
    depends_on: [signer]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  engine:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}builder-console/engine:165e601
    build:
      context: https://github.com/NE-Build-Track/livepeer-builder-core.git#165e60192f85a736bcda9df429d5078bf0328ea2
      dockerfile: deploy/dev-stack/engine/Dockerfile
      args:
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"  # hatch-vcs derives the engine version from .git
    env_file:
      - path: .env
        required: true
    environment:
      LPB_DATABASE_URL: sqlite+aiosqlite:////data/livepeer-builder.db
      LPB_HTTP_HOST: 0.0.0.0
      LPB_HTTP_PORT: "8080"
    ports: ["127.0.0.1:${ENGINE_PORT:-8090}:8080"]  # Swagger and curl: the stack's write path (deploy/README.md#operating)
    volumes: [engine-data:/data]
    depends_on: [signer]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez')"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  console:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}builder-console/console:local
    build:
      context: ..
      dockerfile: deploy/console/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      CONSOLE_ENGINE_URL: http://engine:8080
      CONSOLE_BATTERIES_URL: http://clearinghouse:8081
      CONSOLE_SIGNER_URL: http://clearinghouse:8937
      CONSOLE_SIGNER_METRICS_URL: http://clearinghouse:8939
    ports: ["127.0.0.1:${CONSOLE_PORT:-3060}:3000"]  # no sign-in in v1: keep it on loopback (docs/SECURITY.md)
    depends_on: [engine]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/livez').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  engine-data:
  paid-state:
