<title>Builder Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Design mock of the Builder console: health, network, money, users, usage, jobs, and sources for a Livepeer builder payment stack. Example data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
@layer reset, tokens, base, layout, components, views, motion, utilities;

/* ------------------------------------------------------------------ reset */
@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  img, svg, canvas { display: block; max-inline-size: 100%; }
  input, button, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  table { border-collapse: collapse; }
  ul[role="list"], ol[role="list"] { list-style: none; padding: 0; }
  fieldset { border: 0; padding: 0; min-inline-size: 0; }
  [hidden] { display: none !important; }
  svg:not([viewBox]) { inline-size: 1.1em; block-size: 1.1em; flex: none; }
}

/* ------------------------------------------------------------------ tokens
   Layout concept: a signal-room console. Glass header and a quiet rail on the left;
   each view is a stack of instrument panels; one ion-cyan accent carries "live",
   violet only appears inside motion (packets, the verdict ring). Dark first. */
@layer tokens {
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @property --v { syntax: "<number>"; inherits: false; initial-value: 0; }
  @property --glow { syntax: "<number>"; inherits: false; initial-value: 0; }

  :root {
    color-scheme: dark;
    --hue: 262;

    /* Color: 6 roles, every other tint derived */
    --bg:       light-dark(oklch(97.6% 0.006 262), oklch(14.8% 0.02 265));
    --surface:  light-dark(oklch(99.6% 0.002 262), oklch(19.2% 0.024 265));
    --fg:       light-dark(oklch(24% 0.035 265), oklch(94.5% 0.012 262));
    --accent:   light-dark(oklch(52% 0.15 228), oklch(80% 0.13 212));
    --accent-2: light-dark(oklch(52% 0.2 295), oklch(72% 0.17 300));
    --line-base:light-dark(oklch(88% 0.012 262), oklch(30% 0.03 265));

    /* derived neutrals */
    --surface-2: color-mix(in oklch, var(--surface) 92%, var(--fg));
    --surface-3: color-mix(in oklch, var(--surface) 84%, var(--fg));
    --muted: color-mix(in oklch, var(--fg) 64%, var(--surface));
    --faint: color-mix(in oklch, var(--fg) 45%, var(--surface));
    --line: var(--line-base);
    --line-soft: color-mix(in oklch, var(--line-base) 55%, var(--surface));
    --accent-soft: color-mix(in oklch, var(--accent) 16%, var(--surface));
    --accent-ink: light-dark(oklch(98% 0.01 228), oklch(18% 0.04 230));

    /* status (separate from accent; always paired with a word and a glyph) */
    --ok:   light-dark(oklch(50% 0.13 155), oklch(79% 0.15 158));
    --warn: light-dark(oklch(56% 0.14 68),  oklch(83% 0.14 82));
    --bad:  light-dark(oklch(53% 0.19 25),  oklch(71% 0.18 24));
    --unknown: var(--muted);

    /* Type: display for headings and hero numbers, Geist for UI, Geist Mono for ids and money */
    --font-display: "Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --step--2: 0.72rem;
    --step--1: 0.82rem;
    --step-0: 0.9375rem;
    --step-1: clamp(1.05rem, 1rem + 0.3vw, 1.2rem);
    --step-2: clamp(1.35rem, 1.2rem + 0.8vw, 1.75rem);
    --step-3: clamp(1.8rem, 1.4rem + 1.8vw, 2.7rem);

    --r-sm: 8px;
    --r: 14px;
    --r-lg: 20px;
    --topbar-h: 3.5rem;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --ease-spring: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.2%, 1);
    --shadow: 0 1px 1px oklch(10% 0.03 265 / 0.12), 0 10px 30px -10px oklch(10% 0.03 265 / 0.35);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light; }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
}

/* ------------------------------------------------------------------ base */
@layer base {
  html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: var(--step-0);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-block-size: 100dvh;
    overflow-x: clip;
    scrollbar-color: var(--faint) transparent;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; block-size: env(safe-area-inset-top, 0px);
    z-index: 60; background: var(--bg);
  }
  h1, h2, h3 { text-wrap: balance; line-height: 1.15; font-weight: 600; }
  h1 { font-family: var(--font-display); font-size: var(--step-3); letter-spacing: -0.02em; font-weight: 700; }
  h2 { font-size: var(--step-1); letter-spacing: -0.01em; }
  h3 { font-size: var(--step-0); }
  p { text-wrap: pretty; }
  a { color: inherit; text-decoration-color: color-mix(in oklch, currentColor 35%, transparent); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  code, .mono { font-family: var(--font-mono); font-size: 0.92em; font-variant-ligatures: none; }
  ::selection { background: color-mix(in oklch, var(--accent) 35%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  kbd {
    font-family: var(--font-mono); font-size: var(--step--2);
    padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  }
  [data-num], td.num, .num { font-variant-numeric: tabular-nums; }
}

/* ------------------------------------------------------------------ layout */
@layer layout {
  .skip {
    position: fixed; inset-inline-start: max(16px, env(safe-area-inset-left, 0px)); inset-block-start: calc(env(safe-area-inset-top, 0px) + 8px);
    z-index: 100; padding: 8px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    translate: 0 -200%; transition: translate .2s;
    &:focus-visible { translate: 0 0; }
  }

  .topbar {
    position: sticky; inset-block-start: env(safe-area-inset-top, 0px); z-index: 50;
    container: topbar / inline-size;
    background: color-mix(in oklch, var(--bg) 72%, transparent);
    backdrop-filter: saturate(1.6) blur(16px);
    -webkit-backdrop-filter: saturate(1.6) blur(16px);
    border-block-end: 1px solid var(--line-soft);
  }
  .topbar-inner {
    display: flex; align-items: center; gap: 12px; block-size: var(--topbar-h);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .progress {
    position: absolute; inset: auto 0 -1px 0; block-size: 2px; scale: 0 1; transform-origin: 0 50%;
    background: linear-gradient(90deg in oklch, var(--accent), var(--accent-2));
  }

  .shell { display: grid; grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: sticky; inset-block-start: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); z-index: 40;
    background: color-mix(in oklch, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-block-end: 1px solid var(--line-soft);
  }
  .rail-list {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-inline: contain;
    padding-block: 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    list-style: none;
  }
  .rail-foot { display: none; }

  main {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 64px;
    min-inline-size: 0;
    view-transition-name: main-view;
    &:focus { outline: none; }
  }
  .view { max-inline-size: 84rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
  #usage-body { grid-template-columns: minmax(0, 1fr); }

  @media (width >= 64rem) {
    .shell { grid-template-columns: 15.5rem minmax(0, 1fr); }
    .rail {
      block-size: calc(100dvh - var(--topbar-h) - env(safe-area-inset-top, 0px));
      border-block-end: 0; border-inline-end: 1px solid var(--line-soft);
      background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
      display: flex; flex-direction: column;
    }
    .rail-list { flex-direction: column; overflow: visible; padding: 18px 14px; gap: 2px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
    .rail-foot {
      display: grid; gap: 10px; margin-block-start: auto; padding: 16px 18px 20px;
      padding-left: max(18px, env(safe-area-inset-left, 0px));
      font-size: var(--step--1); color: var(--muted); border-block-start: 1px solid var(--line-soft);
    }
    main { padding-inline: 40px; padding-right: max(40px, env(safe-area-inset-right, 0px)); padding-block: 32px 80px; }
  }
}

/* ------------------------------------------------------------------ components */
@layer components {
  /* brand */
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-inline-size: 0; }
  .brand-mark {
    inline-size: 30px; block-size: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: conic-gradient(from 210deg in oklch, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 0 0 1px color-mix(in oklch, var(--fg) 12%, transparent) inset, 0 6px 18px -6px color-mix(in oklch, var(--accent) 70%, transparent);
    & svg { inline-size: 18px; color: var(--accent-ink); }
  }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; }
  .env-chip {
    font-family: var(--font-mono); font-size: var(--step--2); color: var(--muted);
    padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap;
  }
  .topbar-spacer { flex: 1; }
  .topbar .verdict-mini { display: none; }
  .topbar .checked { display: none; color: var(--muted); font-size: var(--step--1); white-space: nowrap; }
  @container topbar (width > 46rem) {
    .topbar .verdict-mini { display: inline-flex; }
    .topbar .checked { display: inline; }
  }
  @container topbar (width < 30rem) { .env-chip { display: none; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-block-size: 2.5rem; padding-inline: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    font-size: var(--step--1); font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s, translate .15s;
    touch-action: manipulation;
    &:hover { background: var(--surface-2); border-color: color-mix(in oklch, var(--line) 60%, var(--fg)); }
    &:active { translate: 0 1px; }
    & svg { inline-size: 16px; block-size: 16px; flex: none; }
    &.icon { inline-size: 2.5rem; padding: 0; }
    &.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
    &.primary:hover { background: oklch(from var(--accent) calc(l - 0.04) c h); }
  }
  @media (pointer: coarse) { .btn { min-block-size: 2.75rem; } .btn.icon { inline-size: 2.75rem; } }
  .search-btn { color: var(--muted); }
  .search-btn .label { display: none; }
  @container topbar (width > 36rem) {
    .search-btn { min-inline-size: 13rem; justify-content: flex-start; }
    .search-btn .label { display: inline; }
    .search-btn kbd { margin-inline-start: auto; }
  }
  @container topbar (width <= 36rem) { .search-btn kbd { display: none; } }

  /* nav */
  .nav-link {
    position: relative; display: flex; align-items: center; gap: 10px;
    min-block-size: 2.75rem; padding-inline: 12px; border-radius: 10px;
    text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; isolation: isolate;
    transition: color .15s;
    & svg { inline-size: 18px; block-size: 18px; flex: none; }
    & .count { margin-inline-start: auto; font-family: var(--font-mono); font-size: var(--step--2); color: var(--faint); }
    &:hover { color: var(--fg); }
    &[aria-current="page"] { color: var(--fg); }
    &[aria-current="page"] svg { color: var(--accent); }
    & .nav-pill {
      position: absolute; inset: 0; z-index: -1; border-radius: inherit;
      background: var(--surface); border: 1px solid var(--line);
      box-shadow: 0 1px 0 color-mix(in oklch, var(--fg) 6%, transparent) inset, var(--shadow);
      view-transition-name: nav-pill;
    }
    & .nav-flag { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--warn); margin-inline-start: 4px; }
  }
  @media (width < 64rem) { .nav-link .count { display: none; } }

  /* page heading */
  .page-head { display: grid; gap: 8px; }
  .eyebrow {
    font-size: var(--step--2); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  .lede { color: var(--muted); max-inline-size: 68ch; }

  /* panels */
  .panel {
    position: relative; container-type: inline-size;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: clamp(14px, 3cqi, 22px);
    box-shadow: 0 1px 0 color-mix(in oklch, var(--fg) 4%, transparent) inset;
    min-inline-size: 0;
  }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-block-end: 14px; }
  .panel-head h2, .panel-head h3 { display: flex; align-items: center; gap: 10px; }
  .panel-head .sub { color: var(--muted); font-size: var(--step--1); }
  .panel-head .end { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-inline-size: 0; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .section-head p { color: var(--muted); font-size: var(--step--1); }
  .section-head .end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  @media (hover: hover) and (pointer: fine) {
    .lift {
      transition: translate .25s var(--ease-out), box-shadow .25s var(--ease-out), border-color .25s;
      &::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
        background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), color-mix(in oklch, var(--accent) 11%, transparent), transparent 60%);
        transition: opacity .3s;
      }
      &:hover {
        translate: 0 -2px;
        border-color: color-mix(in oklch, var(--accent) 35%, var(--line));
        box-shadow: 0 16px 40px -18px color-mix(in oklch, var(--accent) 45%, transparent), var(--shadow);
      }
      &:hover::after { opacity: 1; }
    }
  }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(var(--min, 16rem), 100%), 1fr)); }

  /* status words + glyphs (shape differs by state, never colour alone) */
  .pill {
    --c: var(--unknown);
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 3px 10px 3px 8px; border-radius: 999px; font-size: var(--step--1); font-weight: 550;
    color: color-mix(in oklch, var(--c) 78%, var(--fg));
    background: color-mix(in oklch, var(--c) 13%, transparent);
    border: 1px solid color-mix(in oklch, var(--c) 30%, transparent);
    &[data-state="ok"] { --c: var(--ok); }
    &[data-state="warn"] { --c: var(--warn); }
    &[data-state="bad"] { --c: var(--bad); }
    &.quiet { background: transparent; border-color: transparent; padding-inline: 0; }
  }
  .glyph {
    --c: var(--unknown);
    position: relative; inline-size: 8px; block-size: 8px; flex: none; background: var(--c); border-radius: 50%;
    [data-state="ok"] > & , &[data-state="ok"] { --c: var(--ok); }
    [data-state="warn"] > &, &[data-state="warn"] { --c: var(--warn); border-radius: 1px; clip-path: polygon(50% 0, 100% 100%, 0 100%); inline-size: 10px; block-size: 9px; }
    [data-state="bad"] > &, &[data-state="bad"] { --c: var(--bad); border-radius: 1px; rotate: 45deg; inline-size: 7px; block-size: 7px; }
    [data-state="unknown"] > &, &[data-state="unknown"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  }
  .live::before {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--c); opacity: 0;
  }

  /* gap chips */
  .gapchip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: var(--step--2); font-weight: 600;
    padding: 1px 7px; border-radius: 6px; text-decoration: none;
    color: var(--warn); background: color-mix(in oklch, var(--warn) 10%, transparent);
    border: 1px dashed color-mix(in oklch, var(--warn) 45%, transparent);
    min-block-size: 22px;
    &:hover { background: color-mix(in oklch, var(--warn) 18%, transparent); }
  }

  /* metric tiles */
  .tile {
    position: relative; display: grid; gap: 4px; align-content: start;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 16px 18px;
    container-type: inline-size; min-inline-size: 0; overflow: clip;
    & .k { font-size: var(--step--1); color: var(--muted); display: flex; align-items: center; gap: 8px; }
    & .v { font-family: var(--font-display); font-size: clamp(1.5rem, 1.1rem + 3.5cqi, 2.2rem); font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    & .v small { font-size: 0.55em; color: var(--muted); font-weight: 500; margin-inline-start: 2px; }
    & .s { font-size: var(--step--1); color: var(--muted); }
    & .spark { margin-block-start: 6px; }
  }
  .tile.metric .k { font-family: var(--font-mono); font-size: var(--step--2); word-break: break-all; }

  /* money display: significant head, dim tail */
  .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amt .tail { color: var(--faint); }

  /* tables */
  .table-scroll { overflow-x: auto; min-inline-size: 0; border-radius: var(--r); border: 1px solid var(--line-soft); background: var(--surface); overscroll-behavior-inline: contain; }
  table.data {
    inline-size: 100%; font-size: var(--step--1);
    & caption { text-align: start; padding: 14px 16px 4px; color: var(--muted); font-size: var(--step--1); caption-side: top; }
    & th, & td { padding: 10px 16px; text-align: start; vertical-align: middle; white-space: nowrap; border-block-end: 1px solid var(--line-soft); }
    & thead th { font-size: var(--step--2); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 600; background: color-mix(in oklch, var(--surface-2) 50%, var(--surface)); position: sticky; top: 0; }
    & tbody tr { transition: background .15s; }
    & tbody tr:hover { background: color-mix(in oklch, var(--accent) 5%, transparent); }
    & tbody tr:last-child > * { border-block-end: 0; }
    & tbody th { font-weight: 500; }
    & .r { text-align: end; }
    & tfoot td, & tfoot th { border-block-start: 1px solid var(--line); border-block-end: 0; font-weight: 600; }
  }
  .slots { display: inline-flex; align-items: center; gap: 8px; }
  meter {
    inline-size: 64px; block-size: 6px; border-radius: 99px; border: 0; background: var(--surface-3);
    &::-webkit-meter-bar { background: var(--surface-3); border: 0; border-radius: 99px; block-size: 6px; }
    &::-webkit-meter-optimum-value { background: var(--ok); border-radius: 99px; }
    &::-webkit-meter-suboptimum-value { background: var(--warn); border-radius: 99px; }
    &::-webkit-meter-even-less-good-value { background: var(--bad); border-radius: 99px; }
    &::-moz-meter-bar { background: var(--ok); border-radius: 99px; }
    &:-moz-meter-sub-optimum::-moz-meter-bar { background: var(--warn); }
    &:-moz-meter-sub-sub-optimum::-moz-meter-bar { background: var(--bad); }
    &.wide { inline-size: 100%; block-size: 8px; }
    &.accent::-webkit-meter-optimum-value { background: linear-gradient(90deg in oklch, var(--accent), var(--accent-2)); }
    &.accent::-moz-meter-bar { background: linear-gradient(90deg in oklch, var(--accent), var(--accent-2)); }
  }

  /* bars */
  .bars { display: grid; gap: 12px; list-style: none; padding: 0; }
  .bars li { display: grid; gap: 5px; }
  .bars .row { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; font-size: var(--step--1); min-inline-size: 0; }
  .bars .row > :first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-inline-size: 0; }
  .bars .row .meta { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { block-size: 8px; border-radius: 99px; background: var(--surface-2); overflow: clip; }
  .bar > i {
    display: block; block-size: 100%; inline-size: calc(var(--p) * 1%); border-radius: 99px; transform-origin: 0 50%;
    background: linear-gradient(90deg in oklch, color-mix(in oklch, var(--accent) 70%, var(--surface)), var(--accent));
  }

  /* rings */
  .ring { --size: 76px; position: relative; inline-size: var(--size); block-size: var(--size); flex: none; }
  .ring svg { inline-size: 100%; block-size: 100%; rotate: -90deg; overflow: visible; }
  .ring .track { fill: none; stroke: var(--surface-3); }
  .ring .val { fill: none; stroke: url(#g-accent); stroke-linecap: round; --v: var(--target); stroke-dasharray: var(--v) 100; }
  .ring .val.alt { stroke: color-mix(in oklch, var(--accent) 35%, var(--surface-3)); }
  .ring .val.ok { stroke: var(--ok); }
  .ring .val.warn { stroke: var(--warn); }
  .ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .ring .lbl b { font-family: var(--font-display); font-size: calc(var(--size) * 0.22); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .lbl small { font-size: 10px; color: var(--muted); }

  /* key/value lists */
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; font-size: var(--step--1); }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { min-inline-size: 0; overflow-wrap: anywhere; }
  @container (width < 26rem) { dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.facts dd { margin-block-end: 8px; } }

  .id { font-family: var(--font-mono); font-size: 0.92em; overflow-wrap: anywhere; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 7px; font-size: var(--step--2);
    background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--muted); font-family: var(--font-mono); white-space: nowrap;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .copy {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 7px; min-block-size: 28px;
    font-family: var(--font-mono); font-size: var(--step--2); color: var(--fg);
    background: var(--surface-2); border: 1px solid var(--line-soft);
    & svg { inline-size: 13px; block-size: 13px; color: var(--muted); }
    &:hover { border-color: var(--accent); }
  }

  /* segmented control */
  .seg {
    position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-soft);
    --i: 0;
    &:has(input[value="7d"]:checked) { --i: 1; }
    &:has(input[value="30d"]:checked) { --i: 2; }
    &::before {
      content: ""; position: absolute; inset-block: 3px; inset-inline-start: 3px; inline-size: calc((100% - 6px) / 3);
      border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line);
      translate: calc(var(--i) * 100%) 0; transition: translate .35s var(--ease-spring);
    }
    & label { position: relative; z-index: 1; display: grid; place-items: center; min-inline-size: 3.6rem; min-block-size: 2.25rem; padding-inline: 12px; cursor: pointer; font-size: var(--step--1); font-weight: 600; color: var(--muted); border-radius: 8px; }
    & label:has(:checked) { color: var(--fg); }
    & label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    & input { position: absolute; opacity: 0; pointer-events: none; }
  }

  /* skeleton shimmer */
  .skel {
    border-radius: 8px; min-block-size: 14px;
    background: linear-gradient(90deg in oklch, var(--surface-2) 0%, var(--surface-3) 45%, var(--surface-2) 90%);
    background-size: 300% 100%;
  }

  /* ticker */
  .ticker {
    position: relative; overflow: clip; border-radius: var(--r); border: 1px solid var(--line-soft); background: var(--surface);
    display: flex; align-items: center; min-inline-size: 0;
    & .ticker-label {
      flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; align-self: stretch; z-index: 1;
      font-size: var(--step--2); text-transform: uppercase; letter-spacing: .1em; font-weight: 650; color: var(--accent);
      background: var(--surface); border-inline-end: 1px solid var(--line-soft);
    }
    & .ticker-view { overflow-x: auto; scrollbar-width: none; min-inline-size: 0; flex: 1;
      mask-image: linear-gradient(90deg, transparent, black 5%, black 92%, transparent); }
    & .ticker-track { display: flex; inline-size: max-content; }
    & ul { display: flex; list-style: none; padding: 0; }
    & li {
      display: flex; align-items: center; gap: 10px; padding: 11px 18px; white-space: nowrap; font-size: var(--step--1);
      border-inline-end: 1px solid var(--line-soft);
    }
    & li .fee { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); }
    & li .app, & li time { color: var(--muted); }
  }

  /* dialog: command palette */
  dialog.palette {
    inline-size: min(40rem, 100% - 32px); max-block-size: min(32rem, 100dvh - 96px);
    margin: max(10vh, 48px) auto auto; padding: 0; border-radius: var(--r-lg);
    border: 1px solid var(--line); background: color-mix(in oklch, var(--surface) 92%, transparent);
    backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
    color: var(--fg);
    box-shadow: 0 30px 80px -20px oklch(5% 0.03 265 / 0.6), 0 0 0 1px color-mix(in oklch, var(--accent) 12%, transparent);
    overflow: clip;
    &[open] { display: flex; flex-direction: column; }
    &::backdrop { background: oklch(12% 0.03 265 / 0.45); backdrop-filter: blur(4px); }
    & search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-block-end: 1px solid var(--line-soft); }
    & search svg { inline-size: 18px; block-size: 18px; color: var(--muted); flex: none; }
    & input { flex: 1; min-inline-size: 0; background: transparent; border: 0; font-size: 1.05rem; outline: none; min-block-size: 2rem; }
    & ul { list-style: none; padding: 8px; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 1px; }
    & .group { padding: 10px 10px 4px; font-size: var(--step--2); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
    & [role="option"] {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; min-block-size: 2.75rem;
      & svg { inline-size: 16px; block-size: 16px; color: var(--muted); flex: none; }
      & .hint { margin-inline-start: auto; font-size: var(--step--2); color: var(--faint); font-family: var(--font-mono); }
    }
    & [role="option"][aria-selected="true"] { background: var(--accent-soft); }
    & [role="option"][aria-selected="true"] svg { color: var(--accent); }
    & .empty { padding: 24px; text-align: center; color: var(--muted); }
    & footer { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-block-start: 1px solid var(--line-soft); font-size: var(--step--2); color: var(--faint); }
  }

  /* toasts */
  .toasts {
    position: fixed; inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) auto;
    margin: 0; padding: 0; border: 0; background: transparent; overflow: visible;
    display: grid; gap: 8px; justify-items: end; inline-size: min(22rem, calc(100vw - 32px));
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; inline-size: 100%;
    background: color-mix(in oklch, var(--surface) 88%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow); font-size: var(--step--1);
    & svg { inline-size: 16px; block-size: 16px; color: var(--accent); flex: none; margin-block-start: 2px; }
    & b { display: block; font-weight: 600; }
    & span { color: var(--muted); }
  }

  /* tooltip */
  .tip {
    position: fixed; inset: auto; margin: 0; max-inline-size: min(22rem, calc(100vw - 32px));
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--fg); color: var(--bg); font-size: var(--step--1); line-height: 1.4;
    box-shadow: var(--shadow); pointer-events: none;
  }
  @supports (anchor-name: --a) {
    .tip.anchored {
      position-anchor: --tip; position-area: block-start; margin-block-end: 8px;
      position-try-fallbacks: flip-block;
    }
  }

  /* stacked bar */
  .stack { display: flex; gap: 2px; block-size: 14px; border-radius: 99px; overflow: clip; background: var(--surface-2); }
  .stack > i { display: block; block-size: 100%; flex: 0 0 calc(var(--p) * 1%); min-inline-size: 0; }
  .stack > i:first-child { border-start-start-radius: 99px; border-end-start-radius: 99px; }
  .swatch { inline-size: 10px; block-size: 10px; border-radius: 3px; flex: none; }
  .c-delivered { background: var(--ok); }
  .c-failed { background: var(--bad); }
  .c-uncertain { background: var(--warn); }
  .c-pending { background: repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--muted); }

  /* details */
  details.gap {
    border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--surface); container-type: inline-size;
    & summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; list-style: none; min-block-size: 3rem; }
    & summary::-webkit-details-marker { display: none; }
    & summary .t { font-weight: 600; flex: 1; min-inline-size: 0; }
    & summary .owner { font-size: var(--step--2); color: var(--muted); white-space: nowrap; }
    & summary::after { content: ""; inline-size: 8px; block-size: 8px; border-inline-end: 2px solid var(--muted); border-block-end: 2px solid var(--muted); rotate: 45deg; transition: rotate .2s; flex: none; }
    &[open] summary::after { rotate: 225deg; }
    & .body { padding: 0 16px 16px; display: grid; gap: 8px; font-size: var(--step--1); max-inline-size: 75ch; }
    & .body .fix { color: var(--muted); }
    &:target, &.flash { border-color: var(--warn); }
  }

  .note { display: flex; gap: 8px; align-items: flex-start; font-size: var(--step--1); color: var(--muted); }
  .muted { color: var(--muted); }
  .sr-only { position: absolute !important; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}

/* ------------------------------------------------------------------ views */
@layer views {
  /* verdict hero */
  .verdict {
    display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr);
    border: 1px solid transparent; border-radius: var(--r-lg); padding: clamp(18px, 3cqi, 28px);
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in oklch, var(--accent) 9%, transparent), transparent 55%) padding-box,
      linear-gradient(var(--surface), var(--surface)) padding-box,
      conic-gradient(from var(--angle) in oklch, color-mix(in oklch, var(--accent) 80%, transparent), color-mix(in oklch, var(--accent-2) 70%, transparent), var(--line-soft) 40%, var(--line-soft) 70%, color-mix(in oklch, var(--accent) 80%, transparent)) border-box;
    container-type: inline-size;
  }
  .verdict-summary { display: grid; gap: 16px; align-content: start; }
  .verdict-word { display: flex; align-items: center; gap: 14px; }
  .verdict-word .big { font-family: var(--font-display); font-size: var(--step-3); font-weight: 750; letter-spacing: -0.03em; line-height: 1; }
  .verdict-word .glyph { inline-size: 14px; block-size: 14px; }
  .verdict .why { color: var(--muted); max-inline-size: 52ch; }
  .verdict .stats { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: var(--step--1); color: var(--muted); }
  .verdict .stats b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
  @container (width > 56rem) { .verdict { grid-template-columns: minmax(16rem, 0.8fr) minmax(0, 1.4fr); align-items: center; } }

  .diagram-scroll { overflow-x: auto; min-inline-size: 0; scrollbar-width: thin; }
  .topology { min-inline-size: 600px; inline-size: 100%; block-size: auto; }
  .topology .node rect { fill: var(--surface-2); stroke: var(--line); }
  .topology .node.hot rect { stroke: color-mix(in oklch, var(--accent) 60%, var(--line)); }
  .topology .node text { fill: var(--fg); font: 600 13px var(--font-ui); }
  .topology .node .sub { fill: var(--muted); font: 400 10.5px var(--font-mono); }
  .topology .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .topology .flow { fill: none; stroke: color-mix(in oklch, var(--accent) 55%, transparent); stroke-width: 1.5; stroke-dasharray: 2 10; stroke-linecap: round; }
  .topology .flow.slow { stroke: color-mix(in oklch, var(--muted) 60%, transparent); }
  .topology .elabel { fill: var(--muted); font: 500 10.5px var(--font-ui); }
  .topology .orch circle.o { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
  .topology .orch.stale circle.o { stroke: var(--warn); stroke-dasharray: 3 2; }
  .topology .orch text { fill: var(--fg); font: 500 11px var(--font-ui); }
  .topology .pkt { fill: var(--accent); }
  .topology .pkt.v { fill: var(--accent-2); }
  .topology .pkt.ok { fill: var(--ok); }
  .topology .pkt.m { fill: var(--muted); }

  .comp-card { display: grid; gap: 14px; align-content: start; }
  .comp-card .panel-head { margin: 0; }
  .comp-icon { inline-size: 34px; block-size: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-soft); flex: none; }
  .comp-icon svg { inline-size: 18px; block-size: 18px; color: var(--accent); }
  .comp-card:has(.checks [data-state="warn"]) .comp-icon { border-color: color-mix(in oklch, var(--warn) 50%, transparent); }
  .comp-card:has(.checks [data-state="warn"]) .comp-icon svg { color: var(--warn); }
  .checks { list-style: none; padding: 0; display: grid; }
  .checks li {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
    padding-block: 10px; border-block-start: 1px solid var(--line-soft);
    & .glyph { justify-self: center; }
    & .label { font-weight: 550; font-size: var(--step--1); }
    & .word { font-size: var(--step--2); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: color-mix(in oklch, var(--c, var(--muted)) 80%, var(--fg)); }
    & .sum { grid-column: 2 / -1; color: var(--muted); font-size: var(--step--1); }
    &[data-state="ok"] { --c: var(--ok); }
    &[data-state="warn"] { --c: var(--warn); }
  }

  /* chart */
  .chart { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; }
  .chart .yaxis { position: relative; inline-size: 3.6rem; font-size: var(--step--2); color: var(--faint); font-variant-numeric: tabular-nums; }
  .chart .yaxis span { position: absolute; inset-inline-end: 0; translate: 0 -50%; }
  .chart .plot { position: relative; block-size: clamp(180px, 30cqi, 260px); touch-action: pan-y; }
  .chart .plot svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; overflow: visible; }
  .chart .grid-line { position: absolute; inset-inline: 0; border-block-start: 1px dashed var(--line-soft); }
  .chart .grid-line.base { border-block-start-style: solid; border-color: var(--line); }
  .chart .xaxis { grid-column: 2; position: relative; block-size: 1.6rem; font-size: var(--step--2); color: var(--faint); }
  .chart .xaxis span { position: absolute; top: 6px; translate: -50% 0; white-space: nowrap; }
  .chart .xaxis span:first-child { translate: 0 0; }
  .chart .xaxis span:last-child { translate: -100% 0; }
  .chart .area { fill: url(#g-area); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .chart .cross { position: absolute; inset-block: 0; inline-size: 0; border-inline-start: 1px solid color-mix(in oklch, var(--fg) 30%, transparent); pointer-events: none; opacity: 0; transition: opacity .12s; }
  .chart .dot { position: absolute; inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 6px color-mix(in oklch, var(--accent) 25%, transparent); translate: -50% -50%; pointer-events: none; opacity: 0; transition: opacity .12s; }
  .chart .enddot { opacity: 1; }
  .chart .ctip { position: absolute; top: 0; translate: -50% calc(-100% - 8px); padding: 6px 9px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: var(--step--2); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
  .chart .ctip b { font-family: var(--font-mono); font-size: 11.5px; display: block; }
  .chart.hovering .cross, .chart.hovering .dot.h, .chart.hovering .ctip { opacity: 1; }

  .orch-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 16px; align-items: center; }
  .orch-card .meta { display: grid; gap: 4px; min-inline-size: 0; }
  .orch-card .url { font-family: var(--font-mono); font-size: var(--step--1); overflow-wrap: anywhere; font-weight: 500; }
  .orch-card .addr { font-family: var(--font-mono); font-size: var(--step--2); color: var(--muted); overflow-wrap: anywhere; }
  .orch-card .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--step--1); color: var(--muted); align-items: center; }

  .offering { display: grid; gap: 12px; align-content: start; }
  .offering .app-id { font-family: var(--font-mono); font-weight: 600; font-size: var(--step-0); overflow-wrap: anywhere; }
  .offering .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .offering .kv div { display: grid; gap: 2px; }
  .offering .kv dt { font-size: var(--step--2); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .offering .kv dd { font-family: var(--font-display); font-weight: 650; font-size: 1.25rem; font-variant-numeric: tabular-nums; }

  .grant { display: grid; gap: 18px; }
  .grant-top { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .grant-top .ring { --size: 104px; }
  .grant-top .info { display: grid; gap: 4px; flex: 1; min-inline-size: 12rem; }
  .grant-top .name { font-family: var(--font-display); font-size: var(--step-2); font-weight: 700; letter-spacing: -0.02em; }
  .grant-top .figures { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: var(--step--1); color: var(--muted); }
  .grant-top .figures b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
  .alloc-list { list-style: none; padding: 0; display: grid; gap: 10px; position: relative; padding-inline-start: 18px; }
  .alloc-list::before { content: ""; position: absolute; inset-block: 0 22px; inset-inline-start: 6px; border-inline-start: 1.5px dashed var(--line); }
  .alloc {
    position: relative; display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-soft);
    &::before { content: ""; position: absolute; inset-inline-start: -12px; inset-block-start: 22px; inline-size: 12px; border-block-start: 1.5px dashed var(--line); }
  }
  .alloc-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .alloc-head .n { font-family: var(--font-mono); font-weight: 600; }
  .alloc-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: var(--step--2); }
  .alloc-figs div { display: grid; gap: 1px; min-inline-size: 0; }
  .alloc-figs span { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .alloc-figs .amt { font-size: var(--step--1); overflow: hidden; text-overflow: ellipsis; }
  @container (width < 30rem) { .alloc-figs { grid-template-columns: minmax(0, 1fr); } }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--step--2); color: var(--muted); }

  .job { display: grid; gap: 18px; }
  .job-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .job-head h3 { font-family: var(--font-mono); font-size: var(--step-0); font-weight: 600; overflow-wrap: anywhere; min-inline-size: 0; }
  .attempts { list-style: none; padding: 0; display: grid; gap: 0; position: relative; }
  .attempt {
    position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 14px; padding-block-end: 18px;
    &::before { content: ""; position: absolute; inset-inline-start: 16px; inset-block: 34px 0; border-inline-start: 2px solid var(--line-soft); }
    &:last-child::before { display: none; }
    & .num { inline-size: 34px; block-size: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; background: var(--surface-2); border: 1.5px solid var(--c, var(--line)); color: var(--fg); }
    &[data-state="ok"] { --c: var(--ok); }
    &[data-state="bad"] { --c: var(--bad); }
    &[data-state="warn"] { --c: var(--warn); }
    & .body { display: grid; gap: 8px; min-inline-size: 0; padding: 4px 14px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-soft); padding-block-start: 10px; }
    & .line1 { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
    & .orch { font-family: var(--font-mono); font-size: var(--step--1); overflow-wrap: anywhere; min-inline-size: 0; }
    & .attrs { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--step--1); color: var(--muted); }
    & .attrs b { color: var(--fg); font-weight: 550; }
  }
  .sessions { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }

/* ------------------------------------------------------------------ motion (all gated) */
@layer motion {
  @media (prefers-reduced-motion: no-preference) {
    @keyframes spin { to { --angle: 360deg; } }
    @keyframes ping { 0% { opacity: .9; scale: .6; } 80%, 100% { opacity: 0; scale: 1.9; } }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    @keyframes marquee { to { translate: -50% 0; } }
    @keyframes vt-out { to { opacity: 0; translate: 0 -6px; filter: blur(3px); } }
    @keyframes vt-in { from { opacity: 0; translate: 0 10px; filter: blur(4px); } }
    @keyframes pop { 0% { scale: 1; } 40% { scale: 1.25; } 100% { scale: 1; } }

    .verdict { animation: spin 9s linear infinite; }
    .live::before { animation: ping 2.2s cubic-bezier(0, 0, .2, 1) infinite; }
    .topology .flow { animation: flow 1.6s linear infinite; }
    .topology .flow.slow { animation-duration: 4s; }
    .skel { animation: shimmer 1.3s linear infinite; }
    .ticker:not(.static) .ticker-view { overflow: clip; }
    .ticker:not(.static) .ticker-track { animation: marquee 70s linear infinite; }
    .ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
    .bump { animation: pop .45s var(--ease-out); }

    /* entry: every time a view goes from display:none to shown */
    .view > *, .stagger > * {
      transition: opacity .5s var(--ease-out), translate .6s var(--ease-out), box-shadow .25s var(--ease-out), border-color .25s;
      @starting-style { opacity: 0; translate: 0 12px; }
    }
    .view > :nth-child(2) { transition-delay: 40ms; }
    .view > :nth-child(3) { transition-delay: 80ms; }
    .view > :nth-child(4) { transition-delay: 120ms; }
    .view > :nth-child(n+5) { transition-delay: 160ms; }
    .stagger > :nth-child(2) { transition-delay: 60ms; }
    .stagger > :nth-child(3) { transition-delay: 120ms; }
    .stagger > :nth-child(4) { transition-delay: 180ms; }
    .stagger > :nth-child(5) { transition-delay: 240ms; }
    .stagger > :nth-child(n+6) { transition-delay: 300ms; }
    @supports (transition-delay: calc(sibling-index() * 1ms)) {
      .stagger > * { transition-delay: calc((sibling-index() - 1) * 55ms); }
    }

    .ring .val { transition: --v 1.3s var(--ease-out) .15s; @starting-style { --v: 0; } }
    .bar > i { transition: scale .9s var(--ease-out) .1s; @starting-style { scale: 0 1; } }
    .stack > i { transition: flex-basis .8s var(--ease-out); @starting-style { flex-basis: 0%; } }

    dialog.palette {
      transition: opacity .2s var(--ease-out), translate .25s var(--ease-out), display .2s allow-discrete, overlay .2s allow-discrete;
      &:not([open]) { opacity: 0; translate: 0 -10px; }
      @starting-style { &[open] { opacity: 0; translate: 0 -10px; } }
      &::backdrop { transition: opacity .2s, display .2s allow-discrete, overlay .2s allow-discrete; }
      &:not([open])::backdrop { opacity: 0; }
      @starting-style { &[open]::backdrop { opacity: 0; } }
    }
    .toast {
      transition: opacity .3s var(--ease-out), translate .4s var(--ease-spring);
      @starting-style { opacity: 0; translate: 0 16px; }
      &.out { opacity: 0; translate: 24px 0; }
    }
    .tip {
      transition: opacity .15s, display .15s allow-discrete, overlay .15s allow-discrete;
      @starting-style { &:popover-open { opacity: 0; } }
    }

    ::view-transition-old(main-view) { animation: vt-out .16s ease-in both; }
    ::view-transition-new(main-view) { animation: vt-in .34s var(--ease-out) both; }
    ::view-transition-group(nav-pill) { animation-duration: .38s; animation-timing-function: var(--ease-spring); }
    ::view-transition-group(root) { animation-duration: .25s; }

    @supports (animation-timeline: scroll()) {
      @keyframes grow-x { to { scale: 1 1; } }
      @keyframes reveal { from { opacity: .35; translate: 0 14px; } }
      .progress { animation: grow-x linear both; animation-timeline: scroll(root); }
      /* overflow-x: clip keeps a wide table's scroll box from leaking page width while the section is translated. */
      .reveal { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% entry 55%; overflow-x: clip; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }

function classify(t) {
  if (NOW - t < 2 * MIN) return "pending";
  const r = R();
  if (r < 0.024) return "failed_after_payment";
  if (r < 0.035) return "uncertain";

function genFor(alloc) {
  if (alloc.spent === 0n) return;
  const app = APPS[alloc.app];
  const injected = sumD(EVENTS.filter((e) => e.alloc === alloc).map((e) => e.fee));
  const target = alloc.spent - injected;
  const avgT = (app.tickets[0] + app.tickets[1]) / 2;
  const nJobs = Math.round(toNum(target) / app.fee / avgT);
  const span = NOW - alloc.created - 30 * MIN;
  const jobs = [];
  while (jobs.length < nJobs) {
    let t = NOW - 25 * SEC - span * Math.pow(R(), 1.3);
    const hr = new Date(t).getUTCHours();
    const w = 0.45 + 0.55 * Math.max(0, Math.sin(((hr - 9) / 24) * 2 * Math.PI));
    if (R() > w + 0.25) continue;
    const orch = pickW([0, 1, 2, 3, 4], app.orchW);
    const k = app.tickets[0] + Math.floor(R() * (app.tickets[1] - app.tickets[0] + 1));
    const job = { id: uuid(), alloc, app, t, orch, cls: classify(t), mode: alloc.app === 0 ? "stream" : "sync", usage: app.usage(), tickets: [] };

    jobs.push(job);
  }
  const all = jobs.flatMap((j) => j.tickets);
  const W = sumD(all.map((x) => x.w));
  let acc = 0n;
  all.forEach((x) => { x.fee = (target * x.w) / W; acc += x.fee; });
  all[all.length - 1].fee += target - acc; // exact remainder
  jobs.forEach((j) => {
    j.fee = sumD(j.tickets.map((x) => x.fee));
    j.status = j.cls === "pending" ? "pending" : "final";
    j.state = { delivered: "succeeded", failed_after_payment: "failed", uncertain: "uncertain", pending: "succeeded" }[j.cls];

    JOBS.push(j);
  });
}

  const items = events.map((e) => `<li><span class="glyph" data-state="ok"></span><span class="fee">${fmtD(e.fee, 18)} USD</span><span class="app mono">${esc(e.app.id)}</span><span class="mono muted">${shortAddr(ORCHS[e.orch].addr)}</span>${timeEl(e.t)}</li>`).join("");

  return `<div class="ticker${staticCls}" role="region" aria-label="Recent signed tickets" tabindex="0"><span class="ticker-label"><span class="glyph live" data-state="ok" style="--c:var(--accent);background:var(--accent)"></span>Signed tickets</span><div class="ticker-view"><div class="ticker-track"><ul role="list">${items}</ul><ul role="list" aria-hidden="true">${items}</ul></div></div></div>`;
}

/* ---------------- usage */
const WINDOWS = { "24h": { ms: DAY, buckets: 24, label: "last 24 hours", by: "hour" }, "7d": { ms: 7 * DAY, buckets: 7, label: "last 7 days", by: "day" }, "30d": { ms: 30 * DAY, buckets: 30, label: "last 30 days", by: "day" } };

function niceMax(x) { if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

  <div class="grid stagger" style="--min:10rem">${Object.entries(counts).map(([k, n]) => `<div class="tile"><span class="k">${k}</span><span class="v" ${countAttr(n, "int")}>${n}</span><span class="s">routes read</span></div>`).join("")}<div class="tile"><span class="k">Known gaps</span><span class="v">${GAPS.length}</span><span class="s">G1–G9</span></div></div>

    <div class="table-scroll"><table class="data"><caption>Upstream routes the console reads</caption><thead><tr><th scope="col">Source</th><th scope="col">Route</th><th scope="col">Credential</th><th scope="col">Used for</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="section" aria-labelledby="h-pins"><div class="section-head"><h2 id="h-pins">Pinned versions</h2><p>The commits deploy/compose.yaml builds.</p></div>
    <div class="pins stagger" style="container-type:inline-size">${PINS.map((p) => `<dl class="pin lift"><dt>${p[0]}</dt><dd><a href="https://github.com/${p[1]}/commit/${p[2]}" rel="external noopener" target="_blank" class="mono">${p[1]}@${p[2].slice(0, 7)}</a><span class="muted">${p[3]}</span></dd></dl>`).join("")}</div></section>
  <section class="section" aria-labelledby="h-gaps"><div class="section-head"><h2 id="h-gaps">Known gaps</h2><p>Each is tracked in docs/references/gaps.md with the change that would close it.</p></div>
    <div style="display:grid;gap:8px" class="stagger">${GAPS.map((g) => `<details class="gap" name="gaps" id="${g.id.toLowerCase()}"><summary><span class="gapchip">${g.id}</span><span class="t">${g.title}</span><span class="owner">owner: ${g.owner}</span></summary><div class="body"><p>${g.impact}</p><p class="fix"><strong>Fix:</strong> ${g.fix}</p></div></details>`).join("")}</div></section>`;
}

/* =====================================================================
   Behaviour: router + view transitions, count-ups, packets, live ticks,
   palette, toasts, tooltips, theme
   ===================================================================== */
let current = "health";
function setView(id) {
  document.querySelectorAll(".view").forEach((s) => (s.hidden = s.dataset.view !== id));
  document.querySelectorAll(".nav-link").forEach((a) => {
    const on = a.dataset.nav === id;
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    const p = a.querySelector(".nav-pill"); if (p) p.remove();
    if (on) a.insertAdjacentHTML("afterbegin", '<span class="nav-pill" aria-hidden="true"></span>');
  });
  current = id;
  document.title = (VIEWS.find((v) => v.id === id)?.label || "Health") + " · Builder Console";
  const active = document.querySelector(`.nav-link[data-nav="${id}"]`); active?.scrollIntoView({ block: "nearest", inline: "nearest" });
  countUp(document.getElementById("view-" + id));
  packets(id === "health");
}
function navigate(id, { focus = true } = {}) {
  if (!VIEWS.some((v) => v.id === id)) id = "health";
  if (id === current && !document.getElementById("view-" + id).hidden) return;
  try { history.replaceState(null, "", "#" + id); } catch {}
  const run = () => { setView(id); window.scrollTo({ top: 0, behavior: "instant" }); };
  if (document.startViewTransition && MOTION()) document.startViewTransition(run); else run();
  if (focus) document.getElementById("main").focus({ preventScroll: true });
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-nav], a.gapchip");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  if (a.classList.contains("gapchip")) { openGap(a.dataset.gap); return; }
  navigate(a.dataset.nav);
});
addEventListener("hashchange", () => navigate(location.hash.slice(1), { focus: false }));
function openGap(id) {
  navigate("sources");
  setTimeout(() => {
    const d = document.getElementById(id.toLowerCase()); if (!d) return;
    d.open = true; d.classList.add("flash");
    d.scrollIntoView({ behavior: MOTION() ? "smooth" : "auto", block: "center" });
    d.querySelector("summary").focus({ preventScroll: true });
    setTimeout(() => d.classList.remove("flash"), 2400);
  }, MOTION() ? 380 : 0);
}

/* count-ups: final value is already in the DOM; this only replays it */
function countUp(root) {
  if (!root || !MOTION()) return;
  root.querySelectorAll("[data-count]").forEach((el) => {
    const end = +el.dataset.count, f = el.dataset.fmt, final = el.textContent;
    const t0 = performance.now(), dur = 1100;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
      el.textContent = p === 1 ? final : fmtCount(end * e, f);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* animated packets along the topology edges */
let packetRAF = 0;
function packets(on) {
  cancelAnimationFrame(packetRAF);
  const g = document.getElementById("packets"); if (!g) return;
  g.innerHTML = "";
  if (!on || !MOTION()) return;
  const specs = [
    { id: "e-sign", cls: "v", speed: 0.32, offs: [0, 0.5] },
    { id: "e-kafka", cls: "", speed: 0.28, offs: [0.1, 0.6] },
    { id: "e-recon", cls: "m", speed: 0.12, offs: [0.3] },
    ...ORCHS.map((o, i) => ({ id: "e-o" + i, cls: "ok", speed: 0.18 + i * 0.03, offs: o.seen > MIN ? [] : [i * 0.21] })),
  ];
  const ps = [];
  specs.forEach((s) => {
    const path = document.getElementById(s.id); if (!path) return;
    const len = path.getTotalLength();
    s.offs.forEach((o) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("r", "4"); c.setAttribute("class", "pkt " + s.cls); g.appendChild(c);
      ps.push({ c, path, len, speed: s.speed, off: o });
    });
  });
  const t0 = performance.now();
  const tick = (t) => {
    if (!document.hidden) {
      const sec = (t - t0) / 1000;
      ps.forEach((p) => {
        const f = (sec * p.speed + p.off) % 1;
        const pt = p.path.getPointAtLength(f * p.len);
        p.c.setAttribute("cx", pt.x.toFixed(1)); p.c.setAttribute("cy", pt.y.toFixed(1));
        p.c.setAttribute("opacity", Math.min(1, Math.sin(f * Math.PI) * 2.2).toFixed(2));
      });
    }
    packetRAF = requestAnimationFrame(tick);
  };
  packetRAF = requestAnimationFrame(tick);
}

/* live ticking: relative times, the poll clock, signer outbox metrics */
let lastPoll = Date.now();
function refreshTimes() {
  document.querySelectorAll("time[data-t]").forEach((el) => {
    const t = +el.dataset.t; if (!t) return;
    el.textContent = rel(t);
  });
  const since = Date.now() - lastPoll;
  const txt = since < 5 * SEC ? "just now" : `${Math.round(since / SEC)} s ago`;
  ["top-checked", "verdict-checked"].forEach((id) => { const el = document.getElementById(id); if (el) el.textContent = txt; });
}
setInterval(refreshTimes, 1000);
setInterval(() => {
  lastPoll = Date.now();
  SIGNER.pending.shift(); SIGNER.oldest.shift();
  const p = Math.max(0, Math.round(3 + (Math.random() - 0.5) * 5)), o = +(0.6 + Math.random() * 2.4).toFixed(1);
  SIGNER.pending.push(p); SIGNER.oldest.push(o);
  const mp = document.getElementById("m-pending"), mo = document.getElementById("m-oldest");
  if (mp) { mp.textContent = p; mp.classList.remove("bump"); void mp.offsetWidth; mp.classList.add("bump"); }
  if (mo) mo.innerHTML = `${o}<small>s</small>`;
  const sp = document.getElementById("spark-pending"), so = document.getElementById("spark-oldest");
  if (sp) sp.innerHTML = spark(SIGNER.pending, { max: 10 });
  if (so) so.innerHTML = spark(SIGNER.oldest, { max: 5 });
}, 15000);

/* hover glow follows the pointer */
document.addEventListener("pointermove", (e) => {
  const el = e.target.closest?.(".lift"); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", `${e.clientX - r.left}px`); el.style.setProperty("--my", `${e.clientY - r.top}px`);
}, { passive: true });

/* toasts */
const toastHost = document.getElementById("toasts");
function toast(title, body = "", ic = "i-check") {
  try { if (!toastHost.matches(":popover-open")) toastHost.showPopover(); } catch {}
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `${icon(ic)}<div><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ""}</div>`;
  toastHost.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), MOTION() ? 400 : 0); }, 4200);
}

/* tooltips via anchor positioning (falls back to measured placement) */
const tip = document.getElementById("tip");
const anchorOK = CSS.supports("anchor-name: --a");
let tipFor = null;
function showTip(el) {
  if (tipFor === el) return;
  hideTip();
  tipFor = el;
  tip.textContent = el.dataset.tip;
  if (anchorOK) { el.style.setProperty("anchor-name", "--tip"); tip.classList.add("anchored"); }
  try { tip.showPopover(); } catch { return; }
  if (!anchorOK) {
    const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    let x = r.left + r.width / 2 - tr.width / 2; x = Math.max(16, Math.min(innerWidth - tr.width - 16, x));
    let y = r.top - tr.height - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
}
function hideTip() {
  if (tipFor) tipFor.style.removeProperty("anchor-name");
  tipFor = null;
  try { tip.hidePopover(); } catch {}
}
document.addEventListener("pointerover", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); else if (tipFor && !e.target.closest("#tip")) hideTip(); });
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); else hideTip(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
addEventListener("scroll", hideTip, { passive: true });

/* copy key prefixes */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  try { await navigator.clipboard.writeText(v); toast("Copied key prefix", v); }
  catch { const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected key prefix", "Press Ctrl+C or ⌘C to copy."); }
});

/* theme */
const themeBtn = document.getElementById("theme-btn");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : !matchMedia("(prefers-color-scheme: light)").matches; };
function syncThemeBtn() { const d = isDark(); themeBtn.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme"); themeBtn.innerHTML = icon(d ? "i-sun" : "i-moon"); }
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  const apply = () => { document.documentElement.dataset.theme = next; syncThemeBtn(); };
  if (document.startViewTransition && MOTION()) document.startViewTransition(apply); else apply();
  try { localStorage.setItem("bc-theme", next); } catch {}
  toast(next === "dark" ? "Dark theme" : "Light theme", "Saved in this browser only.", next === "dark" ? "i-moon" : "i-sun");
}
try { const s = localStorage.getItem("bc-theme"); if (s === "light" || s === "dark") document.documentElement.dataset.theme = s; } catch {}
themeBtn.addEventListener("click", toggleTheme);

/* command palette */
const pal = document.getElementById("palette"), palIn = document.getElementById("palette-input"), palList = document.getElementById("palette-list");
const COMMANDS = [
  ...VIEWS.map((v) => ({ group: "Go to", label: v.label, icon: v.icon, hint: "view", run: () => navigate(v.id) })),
  ...Object.keys(WINDOWS).map((k) => ({ group: "Usage window", label: `Usage over the ${WINDOWS[k].label}`, icon: "i-usage", hint: k, run: () => setWindow(k, true) })),
  { group: "Jobs", label: "Look up the example retry job", icon: "i-jobs", hint: FEATURED_ID.slice(0, 8), run: () => { navigate("jobs"); setTimeout(() => { document.getElementById("job-id").value = FEATURED_ID; lookup(FEATURED_ID, true); }, 300); } },
  { group: "Jobs", label: "Open the newest costed job", icon: "i-jobs", hint: JOBS[0].id.slice(0, 8), run: () => { const id = JOBS.find((j) => j.id !== FEATURED_ID).id; navigate("jobs"); setTimeout(() => { document.getElementById("job-id").value = id; lookup(id, true); }, 300); } },
  { group: "Actions", label: "Toggle light and dark theme", icon: "i-sun", hint: "theme", run: toggleTheme },
  { group: "Actions", label: "Copy the ChatLPT key prefix", icon: "i-copy", hint: "lpg_AaFW…", run: () => { navigator.clipboard?.writeText("lpg_AaFWExampleKeyPrefixZZ").then(() => toast("Copied key prefix", "lpg_AaFWExampleKeyPrefixZZ"), () => toast("Copy blocked here", "lpg_AaFWExampleKeyPrefixZZ")); } },
  ...GAPS.map((g) => ({ group: "Known gaps", label: `${g.id}: ${g.title}`, icon: "i-gap", hint: g.owner, run: () => openGap(g.id) })),
];
let palItems = [], palSel = 0;
function score(label, q) {
  if (!q) return 1;
  const l = label.toLowerCase(); q = q.toLowerCase();
  if (l.includes(q)) return 100 - l.indexOf(q);
  let i = 0; for (const ch of l) if (ch === q[i]) i++;
  return i === q.length ? 10 : 0;
}
function renderPalette() {
  const q = palIn.value.trim();
  palItems = COMMANDS.map((c) => ({ c, s: score(c.label + " " + c.group + " " + c.hint, q) })).filter((x) => x.s > 0).sort((a, b) => (q ? b.s - a.s : 0)).map((x) => x.c);
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  if (!palItems.length) { palList.innerHTML = `<li class="empty" role="presentation">Nothing matches “${esc(q)}”.</li>`; palIn.removeAttribute("aria-activedescendant"); return; }
  let g = "", html = "";
  palItems.forEach((c, i) => {
    if (!q && c.group !== g) { g = c.group; html += `<li class="group" role="presentation">${g}</li>`; }
    html += `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === palSel}">${icon(c.icon)}<span>${esc(c.label)}</span><span class="hint">${esc(c.hint)}</span></li>`;
  });
  palList.innerHTML = html;
  palIn.setAttribute("aria-activedescendant", "opt-" + palSel);
}
function movePal(d) {
  if (!palItems.length) return;
  palSel = (palSel + d + palItems.length) % palItems.length;
  palList.querySelectorAll("[role=option]").forEach((o) => o.setAttribute("aria-selected", +o.dataset.i === palSel));
  palIn.setAttribute("aria-activedescendant", "opt-" + palSel);
  document.getElementById("opt-" + palSel)?.scrollIntoView({ block: "nearest" });
}
function runPal(i) { const c = palItems[i]; if (!c) return; pal.close(); setTimeout(c.run, 10); }
function openPalette() { if (pal.open) return; palIn.value = ""; palSel = 0; renderPalette(); pal.showModal(); palIn.focus(); hideTip(); }
document.getElementById("open-palette").addEventListener("click", openPalette);
palIn.addEventListener("input", () => { palSel = 0; renderPalette(); });
palIn.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); movePal(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); movePal(-1); }
  else if (e.key === "Enter") { e.preventDefault(); runPal(palSel); }
});
palList.addEventListener("click", (e) => { const o = e.target.closest("[role=option]"); if (o) runPal(+o.dataset.i); });
palList.addEventListener("pointermove", (e) => { const o = e.target.closest("[role=option]"); if (o && +o.dataset.i !== palSel) { palSel = +o.dataset.i - 0; movePal(0); } });
pal.addEventListener("click", (e) => { if (e.target === pal) pal.close(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.open ? pal.close() : openPalette(); }
  else if (e.key === "/" && !pal.open && !/input|textarea/i.test(document.activeElement?.tagName || "")) { e.preventDefault(); openPalette(); }
});
if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) document.querySelectorAll("#open-palette kbd").forEach((k) => (k.textContent = "Ctrl K"));

/* boot */
renderNav(); renderHealth(); renderNetwork(); renderMoney(); renderUsers(); renderUsage(); renderJobs(); renderSources();
syncThemeBtn();
setView(VIEWS.some((v) => v.id === location.hash.slice(1)) ? location.hash.slice(1) : "health");
refreshTimes();
setTimeout(() => toast("Connected read-only", "22 GET routes across Engine, Batteries and Signer. Example data."), 1400);
</script>
